services:
  db:
    image: postgres:16-alpine
    container_name: dbp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./supabase/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dbp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: dbp-api
    environment:
      API_ENV: development
      API_CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dbp
      JWT_SECRET: local-dev-jwt-secret-not-for-production-use
      JWT_EXPIRE_MINUTES: "480"
      WEB_ORIGIN: http://localhost:3000
      OAUTH_REDIRECT_BASE: http://localhost:8000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: dbp-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "bun install && bun run dev -- --hostname 0.0.0.0 --port 3000"
    depends_on:
      - api

volumes:
  postgres_data:
  web_node_modules:
